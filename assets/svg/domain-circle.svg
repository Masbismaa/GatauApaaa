<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Domain Expansion barrier">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#2a1150"/>
      <stop offset="45%" stop-color="#150c2c"/>
      <stop offset="100%" stop-color="#07050f"/>
    </radialGradient>
    <linearGradient id="barrier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0"/>
      <stop offset="35%" stop-color="#a855f7" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0b0518"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="hot" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <g stroke="#e9d5ff" stroke-width="1.4" opacity=".5" fill="none">
    <circle cx="800" cy="470" r="300" opacity=".8"/>
    <circle cx="800" cy="470" r="300" stroke-dasharray="3 14" opacity=".6"/>
    <circle cx="800" cy="470" r="352" stroke-dasharray="30 22" opacity=".35"/>
  </g>
  <circle cx="800" cy="470" r="300" fill="none" stroke="#e879f9" stroke-width="2.5" opacity=".55" filter="url(#soft)"/>

  <path d="M500 470 A300 300 0 0 1 1100 470 L1100 470 L500 470 Z" fill="url(#barrier)"/>
  <g stroke="#c084fc" stroke-width="2" opacity=".5" fill="none">
    <path d="M560 240 Q800 150 1040 240"/>
    <path d="M520 330 Q800 215 1080 330"/>
    <path d="M500 470 Q800 340 1100 470"/>
  </g>

  <g filter="url(#hot)">
    <rect x="0" y="0" width="1600" height="230" fill="url(#veil)" opacity=".9"/>
  </g>
  <g fill="#0d0620" opacity=".85">
    <path d="M0 0 h1600 v40 q-200 26 -400 0 t-400 0 t-400 0 t-400 0 Z"/>
  </g>
  <g stroke="#a855f7" stroke-width="1.2" opacity=".45" fill="none">
    <path d="M0 30 q200 30 400 6 t400 6 t400 6 t400 6"/>
    <path d="M0 56 q200 30 400 6 t400 6 t400 6 t400 6"/>
  </g>

  <g opacity=".85">
    <rect x="700" y="120" width="26" height="330" rx="8" fill="#3b0764"/>
    <rect x="874" y="120" width="26" height="330" rx="8" fill="#3b0764"/>
    <rect x="640" y="112" width="320" height="26" rx="9" fill="#4c1d95"/>
    <rect x="666" y="152" width="268" height="16" rx="8" fill="#5b21b6"/>
    <rect x="620" y="96" width="360" height="14" rx="7" fill="#6d28d9"/>
    <rect x="700" y="120" width="26" height="330" fill="url(#beam)" opacity=".6"/>
    <rect x="874" y="120" width="26" height="330" fill="url(#beam)" opacity=".6"/>
  </g>

  <g stroke="#22d3ee" stroke-width="1.6" opacity=".3" fill="none">
    <path d="M0 900 L420 470"/>
    <path d="M1600 900 L1180 470"/>
    <path d="M0 900 L300 470"/>
    <path d="M1600 900 L1300 470"/>
  </g>

  <g fill="#e9d5ff" opacity=".55">
    <circle cx="180" cy="180" r="2.4"/><circle cx="420" cy="120" r="1.8"/>
    <circle cx="1180" cy="160" r="2.2"/><circle cx="1440" cy="240" r="1.7"/>
    <circle cx="980" cy="90" r="2"/><circle cx="240" cy="640" r="1.6"/>
    <circle cx="1360" cy="700" r="2"/><circle cx="620" cy="760" r="1.7"/>
    <circle cx="900" cy="820" r="2.3"/><circle cx="300" cy="820" r="1.5"/>
  </g>

  <g fill="#0a0616" opacity=".95">
    <rect x="0" y="836" width="1600" height="64"/>
  </g>
  <path d="M0 836 h1600" stroke="#7c3aed" stroke-width="2" opacity=".5"/>
</svg>